<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Playwright Compiler</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .container { display: flex; gap: 20px; height: 75vh; }
        textarea, pre { flex: 1; background: #2d2d2d; color: #d4d4d4; padding: 15px; border: 1px solid #444; border-radius: 5px; font-family: monospace; font-size: 14px; resize: none; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-bottom: 10px; }
        button:hover { background: #005999; }
    </style>
</head>
<body>
    <h2>Playwright Online Compiler</h2>
    <button onclick="runCode()">Run Script</button>
    <div class="container">
        <textarea id="codeEditor">// Write your Playwright code here
const { chromium } = require('playwright');

(async () => {
  const browser = await chromium.launch({ headless: true });
  const page = await browser.newPage();
  await page.goto('https://example.com');
  console.log('Page title is:', await page.title());
  await browser.close();
})();</textarea>
        <pre id="output">Results will appear here...</pre>
    </div>

    <script>
        async function runCode() {
            const code = document.getElementById('codeEditor').value;
            const outputBox = document.getElementById('output');
            outputBox.innerText = "Running code on remote container (please wait)...";

            try {
                // REPLACE WITH YOUR RENDER BACKEND URL BELOW
                const response = await fetch('https://playwright-compiler-backend.onrender.com/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const result = await response.json();
                outputBox.innerText = result.output;
            } catch (err) {
                outputBox.innerText = "Error connecting to backend: " + err.message;
            }
        }
    </script>
</body>
</html>
